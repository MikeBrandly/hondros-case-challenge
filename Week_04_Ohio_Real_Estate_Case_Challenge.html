.casehot{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:10px;z-index:10}
.casehot:hover{outline:none;box-shadow:inset 0 0 0 4px rgba(255,218,92,.98),0 0 18px rgba(243,196,59,.72);background:rgba(255,215,70,.08)}
.casehot:focus,.casehot:focus-visible{outline:none}
.casehot.used{background:rgba(0,0,0,.72);outline:2px solid rgba(255,255,255,.2);cursor:default}
.casehot.used::after{content:"OPENED";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#d6b04b;font-weight:900;font-size:clamp(10px,1.2vw,18px);transform:rotate(-12deg)}

.scoreCover{
 position:absolute;z-index:8;background:#030303;color:#fff;text-align:center;
 border-radius:0 0 16px 16px;overflow:hidden;
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 font-weight:1000;text-shadow:0 3px 5px #000;line-height:.9;
}
.scoreCover .liveScore{font-size:clamp(25px,3.35vw,52px);font-weight:1000;white-space:nowrap;letter-spacing:-1px;max-width:94%;}
.scoreCover .pointsLabel{font-size:clamp(13px,1.55vw,24px);font-weight:900;color:#d8d8d8;margin-top:8px;letter-spacing:.5px}

#glow2{left:84.0%;top:7.8%;width:14.6%;height:17.3%}

#modal{position:absolute;inset:0;z-index:30;display:none;background:rgba(0,7,31,.12)}
#modal.show{display:block}
#questionView{

 background:
   linear-gradient(180deg,rgba(8,24,69,.96),rgba(2,9,34,.98)),
   radial-gradient(circle at 50% 0,rgba(44,90,177,.45),transparent 55%);
 border:4px solid #d5a42b;border-radius:20px;
 box-shadow:0 0 0 3px #49330b inset,0 16px 38px rgba(0,0,0,.62),0 0 28px rgba(236,190,61,.25);

 border-radius:8px 8px 0 0;box-shadow:0 3px 9px #000;
}

.badge{
 border:3px solid #f3c43b;border-radius:10px;background:linear-gradient(#151515,#030303);
 padding:8px 12px;color:#f3c43b;font-weight:1000;font-size:clamp(14px,1.45vw,23px);
 text-align:center;box-shadow:0 5px 12px rgba(0,0,0,.55),inset 0 0 12px rgba(243,196,59,.12)
}
.qtitle{
 font-size:clamp(18px,2.0vw,31px);font-weight:1000;color:#fff;text-align:center;
 text-shadow:0 3px 0 #000,0 0 12px #d8a62d;letter-spacing:.5px
}
.question{
 margin-top:1.5%;background:linear-gradient(#fffdf4,#e9dfbd);color:#111;
 border:4px solid #d8a62d;border-radius:14px;padding:1.55% 2%;
 font-size:clamp(16px,1.65vw,26px);font-weight:850;line-height:1.16;
 box-shadow:inset 0 0 0 2px #fff8cf,0 7px 18px rgba(0,0,0,.5)
}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:2.1% 2.2%;margin-top:1.7%}
.ans{
 min-height:60px;padding:11px 15px;border:3px solid #d8a62d;border-radius:11px;
 background:linear-gradient(180deg,#173f8e,#071a4c 58%,#040d2c);color:#fff;
 font-size:clamp(13px,1.18vw,19px);font-weight:800;text-align:left;cursor:pointer;
 box-shadow:inset 0 0 14px rgba(255,255,255,.08),0 6px 10px rgba(0,0,0,.45);
 transition:.15s
}
.ans:hover{transform:translateY(-2px);box-shadow:0 0 16px #d8a62d,0 8px 14px rgba(0,0,0,.55)}
.ans.correct{background:linear-gradient(#159447,#075d29);border-color:#f3c43b}
.ans.wrong{background:linear-gradient(#c72c34,#780b10);border-color:#f3c43b}

.ans.priorWrong{
 opacity:.78;
 box-shadow:inset 0 0 0 2px rgba(255,255,255,.18),0 0 12px rgba(199,44,52,.42);
 cursor:not-allowed;
}

#decision{display:none;margin-top:1.6%;justify-content:space-between;align-items:center;gap:10%}
#decision.show{display:flex}
.decisionBtn{width:43%;padding:13px 14px;border-radius:11px;font-size:clamp(14px,1.45vw,23px);font-weight:1000;cursor:pointer}
#steal{background:linear-gradient(#e14949,#8d0d13);border:3px solid #f3c43b;color:#fff;box-shadow:0 6px 0 #4c0508,0 0 15px rgba(225,73,73,.4)}
#skip{background:linear-gradient(#f0c94e,#9a7016);border:3px solid #ffe08a;color:#fff;box-shadow:0 6px 0 #503808,0 0 15px rgba(240,201,78,.3)}
#message{margin-top:1.2%;text-align:center;font-size:clamp(13px,1.2vw,19px);font-weight:850;color:#ffeaa3;min-height:25px;text-shadow:0 2px 3px #000}
#next{display:none;margin:1.2% auto 0;padding:10px 24px;border:3px solid #f3c43b;border-radius:10px;background:linear-gradient(#183b83,#08163f);color:#fff;font-weight:900;font-size:clamp(14px,1.25vw,20px);cursor:pointer}
#offer{
 display:none;position:absolute;left:30%;right:4%;top:31%;padding:5% 4%;
 text-align:center;background:linear-gradient(180deg,rgba(8,24,69,.97),rgba(2,9,34,.99));
 border:4px solid #d5a42b;border-radius:20px;box-shadow:0 18px 42px #000
}
#offer.show{display:block}
.offerAmt{font-size:clamp(42px,6vw,90px);font-weight:1000;color:#f3c43b;text-shadow:0 4px 0 #5c3b06}
.offerBtns{display:flex;justify-content:center;gap:35px;margin-top:25px}
.offerBtns button{padding:16px 28px;border:3px solid #f3c43b;border-radius:10px;background:#101a3b;color:#fff;font-size:22px;font-weight:900;cursor:pointer}
#final{
 display:none;position:absolute;left:30%;right:4%;top:31%;padding:7% 4%;
 text-align:center;background:linear-gradient(180deg,rgba(8,24,69,.97),rgba(2,9,34,.99));
 border:4px solid #d5a42b;border-radius:20px;box-shadow:0 18px 42px #000;
 font-size:clamp(38px,6vw,86px);font-weight:1000;color:#f3c43b
}
/* Keep the host, title, Ohio mark and both team score boxes visible above the question console. */
#board{z-index:1}
#modal{z-index:20}
@media(max-width:800px){.answers{grid-template-columns:1fr} #modal{overflow:auto}}
</style>
</head>
<body>
<div id="stage">
  <div id="board">
    <div id="glow1" class="teamGlow active"></div><div id="glow2" class="teamGlow"></div>
    <div id="score1" class="scoreCover"><span class="liveScore">0</span><span class="pointsLabel">POINTS</span></div><div id="score2" class="scoreCover"><span class="liveScore">0</span><span class="pointsLabel">POINTS</span></div>
    <button class="casehot" data-case="1" style="left:37.89%;top:35.8398%;width:7.95%;height:10.9375%;" aria-label="Briefcase 1"></button><button class="casehot" data-case="2" style="left:48.70%;top:35.8398%;width:7.95%;height:10.9375%;" aria-label="Briefcase 2"></button><button class="casehot" data-case="3" style="left:59.57%;top:35.8398%;width:7.95%;height:10.9375%;" aria-label="Briefcase 3"></button><button class="casehot" data-case="4" style="left:70.64%;top:35.8398%;width:7.95%;height:10.9375%;" aria-label="Briefcase 4"></button><button class="casehot" data-case="5" style="left:81.32%;top:35.8398%;width:7.95%;height:10.9375%;" aria-label="Briefcase 5"></button><button class="casehot" data-case="6" style="left:37.89%;top:48.3398%;width:7.95%;height:10.9375%;" aria-label="Briefcase 6"></button><button class="casehot" data-case="7" style="left:48.70%;top:48.3398%;width:7.95%;height:10.9375%;" aria-label="Briefcase 7"></button><button class="casehot" data-case="8" style="left:59.57%;top:48.3398%;width:7.95%;height:10.9375%;" aria-label="Briefcase 8"></button><button class="casehot" data-case="9" style="left:70.64%;top:48.3398%;width:7.95%;height:10.9375%;" aria-label="Briefcase 9"></button><button class="casehot" data-case="10" style="left:81.32%;top:48.3398%;width:7.95%;height:10.9375%;" aria-label="Briefcase 10"></button><button class="casehot" data-case="11" style="left:37.89%;top:60.9375%;width:7.95%;height:10.9375%;" aria-label="Briefcase 11"></button><button class="casehot" data-case="12" style="left:48.70%;top:60.9375%;width:7.95%;height:10.9375%;" aria-label="Briefcase 12"></button><button class="casehot" data-case="13" style="left:59.57%;top:60.9375%;width:7.95%;height:10.9375%;" aria-label="Briefcase 13"></button><button class="casehot" data-case="14" style="left:70.64%;top:60.9375%;width:7.95%;height:10.9375%;" aria-label="Briefcase 14"></button><button class="casehot" data-case="15" style="left:81.32%;top:60.9375%;width:7.95%;height:10.9375%;" aria-label="Briefcase 15"></button><button class="casehot" data-case="16" style="left:37.89%;top:73.6328%;width:7.95%;height:10.9375%;" aria-label="Briefcase 16"></button><button class="casehot" data-case="17" style="left:48.70%;top:73.6328%;width:7.95%;height:10.9375%;" aria-label="Briefcase 17"></button><button class="casehot" data-case="18" style="left:59.57%;top:73.6328%;width:7.95%;height:10.9375%;" aria-label="Briefcase 18"></button><button class="casehot" data-case="19" style="left:70.64%;top:73.6328%;width:7.95%;height:10.9375%;" aria-label="Briefcase 19"></button><button class="casehot" data-case="20" style="left:81.32%;top:73.6328%;width:7.95%;height:10.9375%;" aria-label="Briefcase 20"></button>
  </div>

  <div id="modal">
    <div id="questionView">
      <div class="qtop">
        <div id="teamBadge" class="badge">TEAM 1</div>
        <div id="qtitle" class="qtitle"></div>
        <div id="pointsBadge" class="badge"></div>
      </div>
      <div id="question" class="question"></div>
      <div id="answers" class="answers"></div>
      <div id="decision">
        <button id="steal" class="decisionBtn">STEAL THIS QUESTION</button>
        <button id="skip" class="decisionBtn">SKIP — PICK A NEW CASE</button>
      </div>
      <div id="message"></div>
      <button id="next">NEXT</button>
    </div>
    <div id="offer">
      <div class="qtitle">BROKER'S OFFER</div>
      <div id="offerTeam" style="font-size:28px;margin-top:20px"></div>
      <div id="offerAmount" class="offerAmt"></div>
      <div style="font-size:22px">Take the guaranteed bonus, or reject it and keep playing.</div>
      <div class="offerBtns"><button id="takeOffer">TAKE OFFER</button><button id="rejectOffer">NO DEAL</button></div>
    </div>
    <div id="final"></div>
  </div>
</div>
<script>
const QUESTIONS=[{"q": "The borrower under a mortgage loan is the:", "choices": ["Mortgagee", "Mortgagor", "Beneficiary under a deed", "Appraiser"], "correct": 1}, {"q": "The promissory note is evidence of:", "choices": ["A zoning classification", "The debt", "An easement", "Title ownership"], "correct": 1}, {"q": "Loan-to-value ratio compares the loan amount with:", "choices": ["The tax rate", "The borrower's annual income only", "The seller's equity only", "The relevant property value or price used by the lender"], "correct": 3}, {"q": "Appraisal is primarily the process of developing:", "choices": ["A title insurance policy", "An opinion of value", "A mortgage commitment", "A deed restriction"], "correct": 1}, {"q": "The sales comparison approach is based primarily on:", "choices": ["Net operating income only", "Tax assessments only", "Replacement cost only", "Recent sales of comparable properties"], "correct": 3}, {"q": "The cost approach generally considers:", "choices": ["Land value plus replacement or reproduction cost less depreciation", "The seller's mortgage balance", "Only gross rent", "Only comparable sales"], "correct": 0}, {"q": "The income approach is particularly relevant to:", "choices": ["Vacant owner-occupied homes only", "Income-producing property", "Personal property", "Government roads"], "correct": 1}, {"q": "A deed is used primarily to:", "choices": ["Approve a loan", "Set an appraisal fee", "Create a promissory note", "Convey title to real property"], "correct": 3}, {"q": "The grantor in a deed is the party who:", "choices": ["Appraises the property", "Receives the interest", "Conveys the interest", "Insures the title"], "correct": 2}, {"q": "The grantee is the party who:", "choices": ["Signs the promissory note as lender", "Issues title insurance", "Receives the conveyed interest", "Sets zoning"], "correct": 2}, {"q": "Recording a deed primarily provides:", "choices": ["Constructive notice to the public", "Loan approval", "Possession", "A guarantee of market value"], "correct": 0}, {"q": "Market value is best described as:", "choices": ["An opinion based on market conditions and defined assumptions", "The unpaid loan balance", "Always the same as assessed value for purposes of this question in the example being tested", "Always the seller's asking price"], "correct": 0}, {"q": "Depreciation in appraisal refers to:", "choices": ["Mortgage amortization only in the example being tested", "Property tax reduction", "A seller concession", "Loss in value from any cause"], "correct": 3}, {"q": "A comparable sale requiring an upward adjustment generally means the comparable is:", "choices": ["Identical to the subject under the facts presented here", "Not a sale", "Inferior to the subject in the item being adjusted", "Superior to the subject"], "correct": 2}, {"q": "A general warranty deed typically provides:", "choices": ["A mortgage lien", "No warranties at all", "Only a leasehold interest in this particular transaction", "Broad warranties of title"], "correct": 3}, {"q": "A quitclaim deed generally conveys:", "choices": ["Whatever interest the grantor has, if any", "Guaranteed marketable title", "A lender's security interest only as applied to these facts", "A lease for one year"], "correct": 0}, {"q": "Amortization means:", "choices": ["Gradual repayment of debt through scheduled payments", "Recording a mortgage", "Transferring title", "Increasing a loan balance intentionally as applied to these facts"], "correct": 0}, {"q": "One discount point equals:", "choices": ["One month's interest", "10% of the down payment", "1% of the loan amount", "1% of the sale price in every case"], "correct": 2}, {"q": "Highest and best use is a concept used primarily in:", "choices": ["Title insurance", "Appraisal", "Agency disclosure", "Mortgage recording"], "correct": 1}, {"q": "Title is best understood as:", "choices": ["A property tax receipt", "An appraisal report", "The legal concept of ownership rights, not merely the paper deed", "The same thing as a mortgage payment in the example being tested as applied to these facts"], "correct": 2}];
const POINTS=[100,200,300,400,500,750,1000,1250,1500,1750,2000,2250,2500,3000,3500,4000,4500,5000,6000,7500];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let state={scores:[0,0],turn:0,used:new Set(),points:shuffle(POINTS),current:null,played:0,stealMode:false,originalTeam:null,nextTeam:null};

const $=id=>document.getElementById(id);
function sync(){
  const scoreEls=[$('score1').querySelector('.liveScore'),$('score2').querySelector('.liveScore')];
  scoreEls.forEach((el,i)=>{
    const txt=state.scores[i].toLocaleString('en-US');
    el.textContent=txt;
    el.style.fontSize = txt.length>=7 ? 'clamp(20px,2.45vw,38px)' :
                        txt.length>=6 ? 'clamp(22px,2.75vw,43px)' :
                                        'clamp(25px,3.35vw,52px)';
  });
  $('glow1').classList.toggle('active',state.turn===0); $('glow2').classList.toggle('active',state.turn===1);
}
function showBoard(){
  $('modal').classList.remove('show'); $('offer').classList.remove('show'); $('questionView').style.display='block';
  document.querySelectorAll('.casehot').forEach(b=>b.classList.toggle('used',state.used.has(+b.dataset.case)));
  sync();
}
function openCase(n){
  if(state.used.has(n)) return;
  state.used.add(n); state.played++;
  state.current={n,q:QUESTIONS[n-1],pts:state.points[n-1]};
  state.stealMode=false; state.originalTeam=null;
  renderQuestion();
}
function renderQuestion(){
  const c=state.current;
  $('modal').classList.add('show'); $('offer').classList.remove('show'); $('questionView').style.display='block';
  $('teamBadge').textContent='TEAM '+(state.turn+1);
  $('qtitle').textContent='BRIEFCASE '+c.n;
  $('pointsBadge').textContent=c.pts.toLocaleString()+' POINTS';
  $('question').textContent=c.q.q;
  $('answers').innerHTML='';
  c.q.choices.forEach((x,i)=>{
    const b=document.createElement('button'); b.className='ans'; b.textContent=String.fromCharCode(65+i)+'. '+x;
    b.onclick=()=>answer(i,b); $('answers').appendChild(b);
  });
  $('decision').classList.remove('show'); $('message').textContent=''; $('next').style.display='none';
  sync();
}
function disableAnswers(){document.querySelectorAll('.ans').forEach(b=>b.disabled=true)}
function revealCorrect(){document.querySelectorAll('.ans')[state.current.q.correct].classList.add('correct')}
function answer(i,b){
  const correct=i===state.current.q.correct;
  disableAnswers();
  if(correct){
    b.classList.add('correct');
    state.scores[state.turn]+=state.current.pts; sync();
    $('message').textContent='Correct — Team '+(state.turn+1)+' earns '+state.current.pts.toLocaleString()+' points.';
    state.nextTeam=state.stealMode ? state.originalTeam : 1-state.turn;
    $('next').style.display='block';
  } else {
    b.classList.add('wrong');
    if(state.stealMode){
      revealCorrect();
      $('message').textContent='Incorrect steal. No points awarded.';
      state.nextTeam=state.originalTeam;
      $('next').style.display='block';
    } else {
      state.originalTeam=state.turn;
      $('message').textContent='Wrong answer — Team '+(2-state.turn)+' may STEAL this question or SKIP and choose a new case.';
      $('decision').classList.add('show');
    }
  }
}
$('steal').onclick=()=>{
  state.turn=1-state.originalTeam; state.stealMode=true;
  $('teamBadge').textContent='TEAM '+(state.turn+1)+' — STEAL';
  $('decision').classList.remove('show'); $('message').textContent='Team '+(state.turn+1)+': answer the same question.';
  document.querySelectorAll('.ans').forEach((old,i)=>{
    const wasWrong = old.classList.contains('wrong');
    const b=old.cloneNode(true);
    b.className = wasWrong ? 'ans wrong priorWrong' : 'ans';
    b.disabled = wasWrong;
    if(!wasWrong) b.onclick=()=>answer(i,b);
    old.replaceWith(b);
  });
  sync();
};
$('skip').onclick=()=>{
  revealCorrect();
  state.turn=1-state.originalTeam; state.nextTeam=state.turn;
  $('decision').classList.remove('show');
  $('message').textContent='Team '+(state.turn+1)+' skips and will choose a new briefcase.';
  $('next').style.display='block';
  sync();
};
$('next').onclick=()=>{
  state.turn=state.nextTeam;
  if(state.played>=20) return finish();
  if(state.played%5===0) return brokerOffer();
  showBoard();
};
function brokerOffer(){
  $('questionView').style.display='none'; $('offer').classList.add('show'); $('modal').classList.add('show');
  const amt=Math.round((500+state.played*125)/50)*50;
  $('offerTeam').textContent='TEAM '+(state.turn+1);
  $('offerAmount').textContent=amt.toLocaleString()+' BONUS POINTS';
  $('takeOffer').onclick=()=>{state.scores[state.turn]+=amt;state.turn=1-state.turn;state.nextTeam=state.turn;sync();showBoard()};
  $('rejectOffer').onclick=showBoard;
}
function finish(){
  $('questionView').style.display='none'; $('offer').classList.remove('show'); $('modal').classList.add('show');
  $('final').style.display='block';
  const a=state.scores[0],b=state.scores[1];
  $('final').innerHTML=(a===b?'TIE GAME':(a>b?'TEAM 1 WINS':'TEAM 2 WINS'))+
    '<div style="font-size:32px;color:white;margin-top:24px">Team 1: '+a.toLocaleString()+' &nbsp;&nbsp; Team 2: '+b.toLocaleString()+'</div>'+
    '<button onclick="resetGame()" style="margin-top:35px;padding:15px 28px;border:3px solid #f3c43b;border-radius:10px;background:#101a3b;color:white;font-size:22px;font-weight:900;cursor:pointer">PLAY AGAIN</button>';
}

function resetGame(){
  state={
    scores:[0,0],
    turn:0,
    used:new Set(),
    points:shuffle(POINTS),
    current:null,
    played:0,
    stealMode:false,
    originalTeam:null,
    nextTeam:null
  };
  $('final').style.display='none';
  $('final').innerHTML='';
  $('offer').classList.remove('show');
  $('offer').style.display='';
  $('questionView').style.display='block';
  $('decision').classList.remove('show');
  $('message').textContent='';
  $('next').style.display='none';
  document.querySelectorAll('.casehot').forEach(b=>b.classList.remove('used'));
  showBoard();
}

document.querySelectorAll('.casehot').forEach(b=>b.onclick=()=>openCase(+b.dataset.case));
sync();
</script>
</body></html>
